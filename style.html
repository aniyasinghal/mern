<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
   .container{
    background-color: rgb(217, 255, 0);
    height: 100vh;
    border: 1px solid black;
    display: flex;
    justify-content: center;
    align-items: center;
    
   }

   .card{
    background-color: white;
    border: 2px solid black;
    height: 80%;
    width: 30%;
    border-radius: 10px;
    padding: 10px;
   }

   .box1{
    height: 60%;
    border: 1px solid rgb(245, 196, 196);
    background-color: rgb(242, 247, 230);
   }

   .box2{
    height: 40%;
    margin-top: 10px;
    font-size: 18px;
    padding: 15px;
    
   }

   .box2 p{
    height: 50%;
    
   }



   .box2 button{
      height: 20%;
      width: 100%;
      background-color: yellow;
      border: none;
   }

   .box1 img{
    height: 100%;
    width: 100%;
    object-fit: contain;
    } 

    
</style>

<body>
    <div class="container">
        <div class="card">
          <div class="box1">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4keyq2SBv57IH7uRzTrLAJABrOCPQmpm9Erbqxb04iQ&s=10" alt="headphone">
          </div>
          <div class="box2">
            <h1>Wireless headphone</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Iste exercitationem illum, architecto et vitae placeat delectus impedit sequi</p>
            <button>Add to card</button>
          </div>
        </div>
       
    </div>
</body>
</html>
